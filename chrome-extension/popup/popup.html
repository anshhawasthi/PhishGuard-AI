<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishGuard AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-shield">🛡️</div>
        <div>
          <div class="brand-name">PhishGuard AI</div>
          <div class="brand-tagline">Browser Protection</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="status-indicator">
          <span class="status-dot online" id="api-status-dot"></span>
          <span class="status-text" id="api-status-text">Online</span>
        </div>
        <button id="btn-settings-toggle" title="Deployment / API Settings" style="background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px; color: #94A3B8;">⚙️</button>
      </div>
    </header>

    <!-- Cloud / Deployment Settings Drawer -->
    <div id="settings-panel" style="display: none; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 8px; padding: 10px; margin-bottom: 12px; font-size: 11px;">
      <div style="font-weight: 600; color: #38BDF8; margin-bottom: 6px; display: flex; justify-content: space-between;">
        <span>Cloud Deployment Settings</span>
        <span style="font-size: 10px; color: #64748B;">Manifest V3</span>
      </div>
      <label style="color: #94A3B8; display: block; margin-bottom: 2px;">Backend API Endpoint:</label>
      <input type="text" id="setting-api-url" placeholder="http://localhost:8000/api" style="width: 100%; box-sizing: border-box; background: #0B1120; border: 1px solid #334155; color: #F8FAFC; padding: 4px 6px; border-radius: 4px; font-size: 11px; margin-bottom: 6px;">
      <label style="color: #94A3B8; display: block; margin-bottom: 2px;">Frontend Dashboard URL:</label>
      <input type="text" id="setting-dashboard-url" placeholder="http://localhost:5173/dashboard" style="width: 100%; box-sizing: border-box; background: #0B1120; border: 1px solid #334155; color: #F8FAFC; padding: 4px 6px; border-radius: 4px; font-size: 11px; margin-bottom: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <button id="btn-save-settings" style="background: #3B82F6; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px;">Save & Reconnect</button>
        <span id="settings-saved-msg" style="color: #10B981; display: none;">Saved!</span>
      </div>
    </div>

    <!-- Protection Toggle -->
    <div class="toggle-card">
      <div class="toggle-info">
        <span class="toggle-label">Real-Time Protection</span>
        <span class="toggle-sub" id="toggle-sub">AI Engine Monitoring Active</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="protection-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>

    <!-- Active Tab Box -->
    <div class="url-card">
      <div class="card-title">CURRENT TAB</div>
      <div class="active-url" id="active-url">Reading active tab...</div>
    </div>

    <!-- Scan Results Card -->
    <div class="result-card" id="result-card">
      <div class="score-container">
        <div class="score-circle safe" id="score-circle">
          <span class="score-num" id="score-num">--</span>
          <span class="score-sub">RISK</span>
        </div>
        <div class="verdict-box">
          <div class="verdict-pill safe" id="verdict-pill">NOT SCANNED</div>
          <div class="verdict-model" id="verdict-model">Model: Ready</div>
        </div>
      </div>

      <div class="factors-preview" id="factors-preview">
        <!-- Injected via popup.js -->
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="btn btn-scan" id="btn-scan">
        <span class="btn-icon">⚡</span> Scan Website Now
      </button>
      <button class="btn btn-secondary" id="btn-open-dashboard">
        Open Dashboard ↗
      </button>
    </div>

    <!-- Recent Alerts -->
    <div class="alerts-section">
      <div class="section-header">
        <span>RECENT DETECTIONS</span>
        <span class="clear-link" id="clear-alerts">Clear</span>
      </div>
      <div class="alerts-list" id="alerts-list">
        <div class="empty-state">No threats detected recently</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
