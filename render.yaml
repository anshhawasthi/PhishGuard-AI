services:
  # Backend Web Service
  - type: web
    name: phishguard-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        value: admin@phishguard.ai
      - key: ADMIN_PASSWORD
        value: Admin@PhishGuard2026!
